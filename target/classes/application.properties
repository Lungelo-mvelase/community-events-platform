server.port=8080

# Where the data is saved (one JSON file)
app.data-file=./data/store.json
# Put some fictional sample events in the file the first time the app starts
app.seed-enabled=true

# Reject 2.5 for a whole-number field (capacity) instead of silently cutting it to 2
spring.jackson.deserialization.accept-float-as-int=false

# Never send internal error details to the browser
server.error.include-message=never
server.error.include-stacktrace=never

# Log format: the [cid=...] part is the correlation ID of the request
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [cid=%X{correlationId}] %logger{20} - %msg%n
